# GitHub Actions CI — Phase 8.3 Production Pipeline
# Triggers on every push and pull_request to main branch.
# Steps: lint (mypy type check) → unit tests → build Docker image

name: RealProp CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: realprop-app

jobs:
  # ── Job 1: Type Check + Unit Tests ──────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a lightweight subset for CI (skip heavy OCR / ML libs)
          pip install \
            pytest>=8.0.0 \
            mypy>=1.8.0 \
            pydantic>=2.7 \
            pyyaml>=6.0 \
            python-dateutil \
            scikit-learn>=1.5.0 \
            pandas>=2.2.0 \
            joblib>=1.4.0 \
            mlflow>=2.14.0 \
            rapidfuzz>=3.6.0 \
            python-dotenv>=1.0.1 \
            reportlab>=4.1.0 \
            jinja2>=3.1.0 \
            fastapi>=0.115 \
            httpx>=0.27.0 \
            uvicorn[standard]>=0.30 \
            sqlalchemy

      - name: Run mypy type check
        run: |
          # TODO: tighten to --strict once all modules have full type annotations
          mypy src/ \
            --ignore-missing-imports \
            --exclude 'src/app/mainapp.py' \
            --exclude 'src/mlops/' \
          || true   # non-blocking for MVP; remove '|| true' in production

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --ignore=tests/unit/test_ocr.py \
            -p no:warnings
        env:
          # Lightweight env vars so modules don't crash at import time
          MLFLOW_TRACKING_URI: "sqlite:///mlflow_ci.db"
          OPENAI_API_KEY: "sk-fake-ci-key"
          ENV: "ci"

  # ── Job 2: Build Docker Image ────────────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test   # only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push for MVP)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false        # TODO: set to true + add ECR login step for real deployment
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build success
        run: echo "✅ Docker image built successfully — ${{ env.IMAGE_NAME }}:${{ github.sha }}"

