# ============================================================
# RealProp MVP — Rules Configuration
# Version this file: bump rule_set_version on any rule change
# ============================================================

meta:
  rule_set_version: "1.2.0"
  effective_date: "2026-06-05"
  author: "realprop-team"
  description: "Bengaluru/Karnataka Mother Deed & Khata validation rules"

# ----------------------------------------------------------------
# SEVERITY LEVELS:  high | medium | low
# CATEGORY:         mandatory | name_match | id_match | date | area | confidence
# ----------------------------------------------------------------
rules:

  # ── Mandatory field presence ──────────────────────────────────────
  - rule_id: "R001"
    rule_version: "1.0.0"
    name: "MISSING_OWNER_NAME"
    category: "mandatory"
    severity: "high"
    description: "Khata document must have owner name"
    applies_to: ["KHATA"]
    field: "owner_name"
    condition: "missing_or_empty"
    points: 30
    requires_review: true

  - rule_id: "R002"
    rule_version: "1.0.0"
    name: "MISSING_BUYER_NAME"
    category: "mandatory"
    severity: "high"
    description: "Mother Deed must have buyer name"
    applies_to: ["MOTHER_DEED"]
    field: "buyer_name"
    condition: "missing_or_empty"
    points: 30
    requires_review: true

  - rule_id: "R003"
    rule_version: "1.0.0"
    name: "MISSING_SELLER_NAME"
    category: "mandatory"
    severity: "high"
    description: "Mother Deed must have seller name"
    applies_to: ["MOTHER_DEED"]
    field: "seller_name"
    condition: "missing_or_empty"
    points: 20
    requires_review: true

  - rule_id: "R004"
    rule_version: "1.0.0"
    name: "MISSING_PROPERTY_ID"
    category: "mandatory"
    severity: "high"
    description: "Property ID / survey number must be present"
    applies_to: ["MOTHER_DEED", "KHATA"]
    field: "property_id"
    condition: "missing_or_empty"
    points: 25
    requires_review: true

  - rule_id: "R005"
    rule_version: "1.0.0"
    name: "MISSING_KHATA_NUMBER"
    category: "mandatory"
    severity: "medium"
    description: "Khata document must have Khata number"
    applies_to: ["KHATA"]
    field: "khata_number"
    condition: "missing_or_empty"
    points: 15
    requires_review: false

  - rule_id: "R006"
    rule_version: "1.0.0"
    name: "MISSING_REGISTRATION_DATE"
    category: "date"
    severity: "medium"
    description: "Mother Deed must have a registration/execution date"
    applies_to: ["MOTHER_DEED"]
    field: "registration_date"
    condition: "missing_or_empty"
    points: 10
    requires_review: false

  # ── Cross-document matching ───────────────────────────────────────
  - rule_id: "R010"
    rule_version: "1.1.0"
    name: "OWNER_NAME_MISMATCH"
    category: "name_match"
    severity: "high"
    description: "Buyer name in Mother Deed does not match owner name in Khata"
    applies_to: ["CROSS"]
    fields: ["buyer_name", "owner_name"]
    condition: "fuzzy_mismatch"
    fuzzy_threshold: 85
    points: 35
    requires_review: true

  - rule_id: "R011"
    rule_version: "1.1.0"
    name: "PROPERTY_ID_MISMATCH"
    category: "id_match"
    severity: "high"
    description: "Property ID in Mother Deed does not match Khata property ID"
    applies_to: ["CROSS"]
    fields: ["property_id", "khata_property_id"]
    condition: "exact_mismatch"
    points: 40
    requires_review: true

  - rule_id: "R012"
    rule_version: "1.0.0"
    name: "AREA_MISMATCH"
    category: "area"
    severity: "medium"
    description: "Property area in Mother Deed does not match Khata area (>5% tolerance)"
    applies_to: ["CROSS"]
    fields: ["property_area", "khata_area"]
    condition: "numeric_mismatch"
    tolerance_percent: 5
    points: 20
    requires_review: false

  - rule_id: "R013"
    rule_version: "1.0.0"
    name: "ADDRESS_MISMATCH"
    category: "name_match"
    severity: "medium"
    description: "Address in Mother Deed does not match Khata address"
    applies_to: ["CROSS"]
    fields: ["property_address", "khata_address"]
    condition: "fuzzy_mismatch"
    fuzzy_threshold: 70
    points: 15
    requires_review: false

  # ── Confidence-based rules ────────────────────────────────────────
  - rule_id: "R020"
    rule_version: "1.0.0"
    name: "LOW_CONFIDENCE_CRITICAL_FIELD"
    category: "confidence"
    severity: "medium"
    description: "A critical extracted field has low OCR/extraction confidence"
    applies_to: ["MOTHER_DEED", "KHATA"]
    critical_fields: ["owner_name", "buyer_name", "seller_name", "property_id", "khata_number"]
    condition: "confidence_below_threshold"
    confidence_threshold: 0.75
    points: 10
    requires_review: false

  - rule_id: "R021"
    rule_version: "1.0.0"
    name: "LOW_OCR_PAGE_CONFIDENCE"
    category: "confidence"
    severity: "low"
    description: "A page has very low OCR confidence — extraction may be unreliable"
    applies_to: ["MOTHER_DEED", "KHATA"]
    condition: "page_ocr_confidence_below_threshold"
    confidence_threshold: 0.60
    points: 5
    requires_review: false

# ─────────────────────────────────────────────────────────────────────
# Risk scoring thresholds  (sum of triggered rule points)
# ─────────────────────────────────────────────────────────────────────
risk_scoring:
  green_max: 15
  yellow_max: 40
  red_above: 40
  labels:
    green: "Low Risk"
    yellow: "Medium Risk — Review Recommended"
    red: "High Risk — Mandatory Lawyer Review"